name: acme_shop_api
description: A tiny shop API generated from a GraphQL schema by graphql_openapi_codegen.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  graphql_schema3: ^3.2.1
  graphql_server3: ^3.2.2
  json_annotation: ^4.12.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  build_runner: ^2.16.1
  graphql_generator3: ^3.2.1
  graphql_openapi_codegen:
    path: ../
  json_serializable: ^6.14.1
  lint: ^2.12.0

# Everything the generator needs. Only the entries that differ from the
# defaults are worth writing down; this one moves both documentation pages
# under /docs and mounts the REST endpoints under /rest.
graphql_openapi_codegen:
  api_name: Acme Shop
  api_servers:
    - https://api.acme.example
  copy_with: false
  routes:
    graphql: /graphql
    rest: /rest
    graphql_doc: /docs/graphql
    rest_doc: /docs/rest
    openapi: /static/openapi.yaml
